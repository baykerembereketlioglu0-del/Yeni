name: Jarvis APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK derle
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: APK'yı yeniden adlandır
        run: cp app/build/outputs/apk/release/app-release.apk Jarvis.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk
      - name: Son sürüm yayınını güncelle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete jarvis-son-surum --cleanup-tag -y || true
          gh release create jarvis-son-surum Jarvis.apk --prerelease \
            --title "Jarvis — son sürüm" --target "$GITHUB_SHA" \
            --notes "Tablete indirip kurmak için Jarvis.apk dosyasına dokunun. (Dal: $GITHUB_REF_NAME)"
