<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Issız Adaya Düştün! Yanına 1 Eşya Alabilirsin</title>
<style>
/*@FONT:Fredoka:fredoka:500@*/
/*@FONT:Fredoka:fredoka:600@*/
/*@FONT:Fredoka:fredoka:700@*/
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { display: flex; align-items: center; justify-content: center; }
canvas { height: 96vh; aspect-ratio: 9 / 16; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================================
//  ISSIZ ADAYA DÜŞTÜN! — "Hangisini seçerdin? Ama cevap bilimde."  (1080x1920, 50 sn döngü)
//  Kısayollar: Boşluk = baştan, P = duraklat, Sağ/Sol ok = 5 sn ileri/geri. Ses: ilk tıklamada.
// =====================================================================================
const W = 1080, H = 1920, SURE = 50;
window.SURE = SURE;
const cv = document.getElementById("c"), g = cv.getContext("2d");
const FONT = '"Fredoka", "Arial Rounded MT Bold", sans-serif';

// ---------------------------------------------------------------- renkler
const INK = "#1E1B2E";
const C = {
  sari: "#FFD23F", yesil: "#3DDC84", kirmizi: "#FF4D5E", beyaz: "#FFFFFF", krem: "#FFF6E5",
  ten: "#FFD3B0", tenKoyu: "#F2B48C", sac: "#3B2A20", lacivert: "#2B3A67", fular: "#E63946", sort: "#3D5A80",
  kum: "#F6D186", kumKoyu: "#E3B567", kumIslak: "#D9A85A", deniz: "#13B3C4", denizKoyu: "#0B7A99",
  palmiye: "#2EAD5B", palmiyeKoyu: "#1E8C45", govde: "#A0673A", govdeKoyu: "#7A4A26",
};
const SECENEK = [
  { ad: "AYNA", renk: "#4D96FF" }, { ad: "ÇİKOLATA", renk: "#FF7A45" },
  { ad: "GÖZLÜK", renk: "#9B5DE5" }, { ad: "BOŞ ŞİŞE", renk: "#12B5A8" },
];

// ---------------------------------------------------------------- yardımcılar
const sat = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ara = (t, a, b) => sat((t - a) / (b - a));
const E = {
  io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  o: k => 1 - Math.pow(1 - k, 3), i: k => k * k * k, q: k => k * k,
  sine: k => -(Math.cos(Math.PI * k) - 1) / 2,
  back: k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  elastic: k => k === 0 ? 0 : k === 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * (2 * Math.PI) / 3) + 1,
  bounce: k => { const n = 7.5625, d = 2.75; if (k < 1 / d) return n * k * k; if (k < 2 / d) return n * (k -= 1.5 / d) * k + .75;
    if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + .9375; return n * (k -= 2.625 / d) * k + .984375; },
};
function rnd(a, b = 0) { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); }
function hex2rgba(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function karistir(h1, h2, k) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const r = Math.round(lerp(a >> 16 & 255, b >> 16 & 255, k)), gg = Math.round(lerp(a >> 8 & 255, b >> 8 & 255, k)), bb = Math.round(lerp(a & 255, b & 255, k));
  return `rgb(${r},${gg},${bb})`;
}

// ---------------------------------------------------------------- çizim temel taşları (temiz kontur)
function sekil(cizim, dolgu, kontur = INK, lw = 7) {
  g.beginPath(); cizim(); if (dolgu) { g.fillStyle = dolgu; g.fill(); }
  if (kontur && lw) { g.lineWidth = lw; g.strokeStyle = kontur; g.lineJoin = "round"; g.lineCap = "round"; g.stroke(); }
}
function daire(x, y, r, dolgu, kontur = INK, lw = 7) { sekil(() => g.arc(x, y, r, 0, Math.PI * 2), dolgu, kontur, lw); }
function elips(x, y, rx, ry, dolgu, kontur = INK, lw = 7, rot = 0) { sekil(() => g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2), dolgu, kontur, lw); }
function yuvarlakDik(x, y, w, h, r, dolgu, kontur = INK, lw = 7) { sekil(() => g.roundRect(x, y, w, h, r), dolgu, kontur, lw); }
function cizgi(pts, renk, lw, konturlu = true) { // kalın, konturlu çizgi (kol/bacak)
  const yol = () => { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); };
  g.lineCap = "round"; g.lineJoin = "round";
  if (konturlu) { yol(); g.lineWidth = lw + 12; g.strokeStyle = INK; g.stroke(); }
  yol(); g.lineWidth = lw; g.strokeStyle = renk; g.stroke();
}
function parilti(x, y, r, renk, alfa = 1) { // yumuşak ışık halesi
  if (alfa <= 0) return; const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, hex2rgba(renk, .9 * alfa)); gr.addColorStop(.35, hex2rgba(renk, .35 * alfa)); gr.addColorStop(1, hex2rgba(renk, 0));
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
}
function yildizSekil(x, y, r1, r2, n, rot, dolgu, kontur = INK, lw = 5) {
  sekil(() => { for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n, r = i % 2 ? r2 : r1; i ? g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : g.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } g.closePath(); }, dolgu, kontur, lw);
}
function pirilti(x, y, r, rot, alfa = 1) { // 4 köşeli parlama
  if (alfa <= 0) return; g.save(); g.globalAlpha = alfa; g.translate(x, y); g.rotate(rot);
  g.fillStyle = "#fff"; g.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .22 : r; i ? g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : g.moveTo(rr, 0); }
  g.closePath(); g.fill(); g.restore();
}
function yazi(m, x, y, o = {}) {
  const { boyut = 80, renk = "#fff", kontur = INK, klw = 14, hiza = "center", agirlik = 700, alfa = 1, aci = 0, olcek = 1, golge = true } = o;
  if (alfa <= 0) return;
  g.save(); g.globalAlpha = alfa; g.translate(x, y); g.rotate(aci); g.scale(olcek, olcek);
  g.font = `${agirlik} ${boyut}px ${FONT}`; g.textAlign = hiza; g.textBaseline = "middle"; g.lineJoin = "round";
  if (golge) { g.fillStyle = "rgba(0,0,0,.35)"; g.fillText(m, 0, boyut * .09); if (kontur) { g.lineWidth = klw; g.strokeStyle = "rgba(0,0,0,.35)"; g.strokeText(m, 0, boyut * .09); } }
  if (kontur) { g.lineWidth = klw; g.strokeStyle = kontur; g.strokeText(m, 0, 0); }
  g.fillStyle = renk; g.fillText(m, 0, 0); g.restore();
}

// ---------------------------------------------------------------- EŞYA ÇİZİMLERİ (ikon olarak da kullanılır)
function aynaCiz(x, y, s, rot = 0, t = 0, parlama = 0) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  yuvarlakDik(-16, 40, 32, 120, 14, "#C98B4B");                       // sap
  for (let i = 0; i < 3; i++) sekil(() => { g.moveTo(-16, 70 + i * 26); g.lineTo(16, 70 + i * 26); }, null, "#8A5A2B", 5);
  elips(0, -20, 78, 92, "#E3A857");                                   // çerçeve
  const gr = g.createLinearGradient(-60, -100, 60, 60); gr.addColorStop(0, "#E9FBFF"); gr.addColorStop(.5, "#9ED8F0"); gr.addColorStop(1, "#CFF1FF");
  elips(0, -20, 58, 72, gr, "#8A5A2B", 5);
  g.save(); g.beginPath(); g.ellipse(0, -20, 58, 72, 0, 0, Math.PI * 2); g.clip();          // yansıma şeritleri
  g.fillStyle = "rgba(255,255,255,.85)"; g.beginPath(); g.moveTo(-40, -50); g.lineTo(-10, -90); g.lineTo(5, -90); g.lineTo(-25, -50); g.fill();
  g.beginPath(); g.moveTo(-20, -20); g.lineTo(20, -75); g.lineTo(30, -75); g.lineTo(-10, -20); g.fill(); g.restore();
  if (parlama > 0) { parilti(10, -30, 160, "#FFFFFF", parlama); pirilti(18, -40, 90 * parlama, t * 2, parlama); }
  g.restore();
}
function cikolataCiz(x, y, s, rot = 0, isirik = 0) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  // ambalaj
  yuvarlakDik(-70, -10, 140, 120, 14, "#E63946");
  yazi("ÇİKO", 0, 50, { boyut: 34, renk: "#fff", klw: 8, golge: false });
  sekil(() => { g.moveTo(-70, -10); g.lineTo(-55, -24); g.lineTo(-40, -10); g.lineTo(-25, -24); g.lineTo(-10, -10); g.lineTo(5, -24); g.lineTo(20, -10); g.lineTo(35, -24); g.lineTo(50, -10); g.lineTo(70, -10); }, "#C0C9D6", INK, 5);
  // çikolata (ısırılmış)
  g.save(); g.beginPath(); g.rect(-70, -140, 140, 130);
  if (isirik > 0) { g.moveTo(70, -140); for (let i = 0; i < 4; i++) g.arc(40 - i * 20, -140, 18 * isirik, 0, Math.PI, false); }
  g.clip("evenodd");
  yuvarlakDik(-62, -132, 124, 130, 12, "#7B4B2A");
  for (let r = 0; r < 3; r++) for (let c = 0; c < 2; c++) yuvarlakDik(-52 + c * 56, -122 + r * 40, 48, 32, 8, "#8E5A35", "#5E361C", 4);
  g.restore();
  g.restore();
}
function gozlukCiz(x, y, s, rot = 0, renk = "#9B5DE5") {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  for (const k of [-1, 1]) {
    const gr = g.createRadialGradient(k * 55 - 12, -12, 4, k * 55, 0, 46); gr.addColorStop(0, "rgba(255,255,255,.95)"); gr.addColorStop(1, "rgba(180,230,255,.55)");
    daire(k * 55, 0, 44, gr, renk, 12);
    g.save(); g.strokeStyle = "rgba(255,255,255,.9)"; g.lineWidth = 6; g.beginPath(); g.arc(k * 55, 0, 30, -2.6, -1.8); g.stroke(); g.restore();
  }
  sekil(() => { g.moveTo(-14, -6); g.quadraticCurveTo(0, -20, 14, -6); }, null, renk, 10);
  sekil(() => { g.moveTo(-98, -6); g.lineTo(-118, -14); }, null, renk, 10); sekil(() => { g.moveTo(98, -6); g.lineTo(118, -14); }, null, renk, 10);
  g.restore();
}
function siseCiz(x, y, s, rot = 0, su = 0, temiz = 0, t = 0) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  const yol = () => { g.moveTo(-22, -150); g.lineTo(22, -150); g.lineTo(22, -120); g.quadraticCurveTo(52, -100, 52, -60); g.lineTo(52, 90); g.quadraticCurveTo(52, 110, 32, 110); g.lineTo(-32, 110); g.quadraticCurveTo(-52, 110, -52, 90); g.lineTo(-52, -60); g.quadraticCurveTo(-52, -100, -22, -120); g.closePath(); };
  sekil(yol, "rgba(200,240,255,.45)", INK, 7);
  if (su > 0) { g.save(); g.beginPath(); yol(); g.clip(); const ust = lerp(108, -95, su) + Math.sin(t * 6) * 3;
    g.fillStyle = temiz > .5 ? "rgba(90,200,255,.85)" : karistir("#8FB38A", "#5AC8FF", temiz); g.fillRect(-60, ust, 120, 220);
    g.fillStyle = "rgba(255,255,255,.5)"; g.fillRect(-60, ust, 120, 6); g.restore(); }
  yuvarlakDik(-26, -178, 52, 32, 8, "#12B5A8");
  yuvarlakDik(-52, -10, 104, 50, 6, "#12B5A8", INK, 6);
  g.save(); g.strokeStyle = "rgba(255,255,255,.8)"; g.lineWidth = 8; g.lineCap = "round"; g.beginPath(); g.moveTo(-34, -60); g.lineTo(-34, 70); g.stroke(); g.restore();
  g.restore();
}
const ESYA_CIZ = [
  (x, y, s, t) => aynaCiz(x, y + 10, s * .9, -.15, t, .35 + .25 * Math.sin(t * 4)),
  (x, y, s) => cikolataCiz(x, y + 40, s * .95, .12),
  (x, y, s) => gozlukCiz(x, y, s * 1.05, -.08),
  (x, y, s, t) => siseCiz(x, y + 10, s * .85, .1, .35, 1, t),
];

// ---------------------------------------------------------------- KARAKTER: "SEN"
// o: { ifade, kolL:[omuz,dirsek], kolR, bak:[dx,dy], egik, olcekY, gozluk, dil, ter, gozyasi, etiket, t }
function sen(x, y, s, o = {}) {
  const t = o.t || 0, ifade = o.ifade || "mutlu";
  g.save(); g.translate(x, y); g.scale(s, s * (o.olcekY || 1)); g.rotate(o.egik || 0);
  // gölge
  g.save(); g.scale(1, .25); g.fillStyle = "rgba(0,0,0,.18)"; g.beginPath(); g.arc(0, 0, 95, 0, Math.PI * 2); g.fill(); g.restore();
  // bacaklar + ayakkabı
  const adim = o.yuru ? Math.sin(t * 12) * 16 : 0;
  cizgi([[-26, -120], [-30 + adim, -8]], C.ten, 26); cizgi([[26, -120], [30 - adim, -8]], C.ten, 26);
  elips(-36 + adim, 0, 32, 18, "#2B2D42"); elips(36 - adim, 0, 32, 18, "#2B2D42");
  // şort
  sekil(() => { g.moveTo(-60, -150); g.lineTo(60, -150); g.lineTo(64, -92); g.lineTo(6, -92); g.lineTo(0, -110); g.lineTo(-6, -92); g.lineTo(-64, -92); g.closePath(); }, C.sort);
  // kollar
  const kol = (taraf, aci) => {
    const [a1, a2] = aci; const ox = taraf * 62, oy = -240;
    const dx = ox + Math.sin(a1) * 72 * taraf, dy = oy + Math.cos(a1) * 72;
    const ex = dx + Math.sin(a1 + a2) * 66 * taraf, ey = dy + Math.cos(a1 + a2) * 66;
    cizgi([[ox, oy], [dx, dy]], C.beyaz, 32); cizgi([[dx, dy], [ex, ey]], C.ten, 24);
    daire(ex, ey, 19, C.ten, INK, 6);
    return [ex, ey];
  };
  const elL = kol(-1, o.kolL || [.25, .15]);
  // gövde (çizgili denizci tişörtü)
  const govdeYol = () => { g.moveTo(-58, -250); g.quadraticCurveTo(-74, -250, -70, -200); g.lineTo(-62, -140); g.quadraticCurveTo(0, -128, 62, -140); g.lineTo(70, -200); g.quadraticCurveTo(74, -250, 58, -250); g.closePath(); };
  sekil(govdeYol, C.beyaz);
  g.save(); g.beginPath(); govdeYol(); g.clip(); g.fillStyle = C.lacivert;
  for (let i = 0; i < 4; i++) g.fillRect(-80, -228 + i * 26, 160, 11); g.restore();
  sekil(govdeYol, null);
  // fular
  sekil(() => { g.moveTo(-34, -252); g.lineTo(34, -252); g.lineTo(0, -206); g.closePath(); }, C.fular);
  sekil(() => { g.moveTo(0, -214); g.lineTo(-12, -190); g.lineTo(12, -190); g.closePath(); }, C.fular, INK, 5);
  const elR = kol(1, o.kolR || [.25, .15]);
  // kafa
  const hy = -342;
  elips(-98, hy + 4, 18, 24, C.ten); elips(98, hy + 4, 18, 24, C.ten);   // kulaklar
  daire(0, hy, 100, C.ten);
  // saç
  sekil(() => { g.moveTo(-98, hy - 10); g.quadraticCurveTo(-100, hy - 100, -10, hy - 104); g.quadraticCurveTo(90, hy - 108, 100, hy - 14);
    g.quadraticCurveTo(80, hy - 50, 50, hy - 58); g.quadraticCurveTo(40, hy - 40, 20, hy - 52); g.quadraticCurveTo(0, hy - 34, -24, hy - 54);
    g.quadraticCurveTo(-60, hy - 40, -70, hy - 50); g.quadraticCurveTo(-90, hy - 30, -98, hy - 10); g.closePath(); }, C.sac);
  sekil(() => { g.moveTo(-6, hy - 102); g.quadraticCurveTo(10, hy - 150, 40, hy - 132); g.quadraticCurveTo(14, hy - 130, 12, hy - 104); }, C.sac, INK, 6); // perçem
  // yanaklar
  g.fillStyle = "rgba(255,120,120,.35)"; g.beginPath(); g.ellipse(-60, hy + 38, 20, 12, 0, 0, Math.PI * 2); g.ellipse(60, hy + 38, 20, 12, 0, 0, Math.PI * 2); g.fill();
  // gözler
  const kirp = (t % 3.3) < .12 || ifade === "susuz" ? .15 : 1;
  const [bx, by] = o.bak || [0, 0];
  for (const k of [-1, 1]) {
    const ex = k * 36, ey = hy - 4;
    const ry = (ifade === "saskin" ? 30 : 26) * kirp;
    elips(ex, ey, 22, ry, "#fff", INK, 6);
    if (kirp > .5) { const pr = ifade === "saskin" ? 8 : 12; daire(ex + bx * 8, ey + by * 8 + 2, pr, INK, null, 0); daire(ex + bx * 8 + 4, ey + by * 8 - 3, 4, "#fff", null, 0); }
  }
  // kaşlar
  const kas = { mutlu: [-.1, 0], saskin: [-.25, -14], uzgun: [.35, 0], kararli: [-.35, 6], susuz: [.3, 2], yiyor: [-.15, 0], gulumse: [-.1, 0] }[ifade] || [0, 0];
  for (const k of [-1, 1]) { g.save(); g.translate(k * 36, hy - 46 + kas[1]); g.rotate(kas[0] * k); sekil(() => { g.moveTo(-18, 0); g.lineTo(18, 0); }, null, INK, 9); g.restore(); }
  // ağız
  const my = hy + 46;
  if (ifade === "mutlu") { sekil(() => { g.moveTo(-30, my - 6); g.quadraticCurveTo(0, my + 44, 30, my - 6); g.closePath(); }, "#8E2C3A", INK, 6);
    g.save(); g.beginPath(); g.moveTo(-30, my - 6); g.quadraticCurveTo(0, my + 44, 30, my - 6); g.closePath(); g.clip(); daire(0, my + 26, 16, "#FF7A8A", null, 0); g.restore(); }
  else if (ifade === "gulumse" || ifade === "kararli") sekil(() => { g.moveTo(-24, my); g.quadraticCurveTo(0, my + (ifade === "kararli" ? 12 : 22), 26, my - (ifade === "kararli" ? 6 : 0)); }, null, INK, 7);
  else if (ifade === "saskin") elips(0, my + 8, 14, 18, "#8E2C3A", INK, 6);
  else if (ifade === "uzgun") sekil(() => { g.moveTo(-24, my + 14); g.quadraticCurveTo(0, my - 8, 24, my + 14); }, null, INK, 7);
  else if (ifade === "yiyor") { const c = Math.abs(Math.sin(t * 14)); elips(-34, my - 4, 22, 16 + c * 4, C.tenKoyu, null, 0); elips(34, my - 4, 22, 16 + c * 4, C.tenKoyu, null, 0); elips(0, my + 4, 16, 6 + c * 6, "#8E2C3A", INK, 6); }
  else if (ifade === "susuz") { sekil(() => { g.moveTo(-26, my + 6); for (let i = 0; i <= 4; i++) g.lineTo(-26 + i * 13, my + 6 + (i % 2 ? -6 : 4)); }, null, INK, 6);
    if (o.dil !== false) sekil(() => { g.moveTo(-6, my + 8); g.quadraticCurveTo(0, my + 44, 16, my + 8); }, "#FF7A8A", INK, 5); }
  // gözlük
  if (o.gozluk) gozlukCiz(0, hy - 4, .62, 0, o.gozlukRenk || "#9B5DE5");
  // ter / gözyaşı
  if (o.ter) for (let i = 0; i < 2; i++) { const f = ((t * 1.4 + i * .5) % 1); g.save(); g.globalAlpha = 1 - f; g.translate(i ? 96 : -100, hy - 40 + f * 70); sekil(() => { g.moveTo(0, -18); g.quadraticCurveTo(14, 4, 0, 10); g.quadraticCurveTo(-14, 4, 0, -18); }, "#7FD3FF", INK, 4); g.restore(); }
  if (o.gozyasi) for (const k of [-1, 1]) { const f = (t * 1.2) % 1; sekil(() => { g.moveTo(k * 36, hy + 18); g.lineTo(k * 36, hy + 18 + f * 60); }, null, "#7FD3FF", 9); }
  g.restore();
  // "SEN" etiketi (dünya koordinatında, kafanın üstünde)
  if (o.etiket !== false) {
    const ey = y - 520 * s * (o.olcekY || 1) + Math.sin(t * 4) * 8;
    g.save(); g.translate(x, ey);
    yuvarlakDik(-62, -36, 124, 66, 33, C.sari, INK, 6);
    yazi("SEN", 0, 0, { boyut: 46, renk: INK, kontur: null, golge: false });
    sekil(() => { g.moveTo(-14, 30); g.lineTo(14, 30); g.lineTo(0, 50); g.closePath(); }, C.sari, INK, 6);
    g.restore();
  }
  // elleri dışarı ver (eşya tutmak için, dünya koordinatı)
  const donus = (p) => [x + p[0] * s, y + p[1] * s * (o.olcekY || 1)];
  return { elL: donus(elL), elR: donus(elR) };
}

// ---------------------------------------------------------------- ADA SAHNESİ
// gun: 0 = gündüz, .5 = gün batımı, 1 = gece
function gokyuzu(gun, t) {
  const ust = gun < .5 ? karistir("#2D9CDB", "#FF7E5F", gun * 2) : karistir("#FF7E5F", "#0B1B3F", (gun - .5) * 2);
