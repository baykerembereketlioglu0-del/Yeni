<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Halıya Kola Döktün! Annen Terlikle Geliyor</title>
<style>
/*@FONT:Fredoka:fredoka:500@*/
/*@FONT:Fredoka:fredoka:600@*/
/*@FONT:Fredoka:fredoka:700@*/
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { display: flex; align-items: center; justify-content: center; }
canvas { height: 96vh; aspect-ratio: 9 / 16; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================================
//  HALIYA KOLA DÖKTÜN! — "Annen terlikle geliyor, nereye kaçarsın?"  (1080x1920, 50 sn döngü) — Deniz Seçti
//  Kısayollar: Boşluk = baştan, P = duraklat, Sağ/Sol ok = 5 sn ileri/geri. Ses: ilk tıklamada.
// =====================================================================================
const W = 1080, H = 1920, SURE = 50;
window.SURE = SURE;
const cv = document.getElementById("c"), g = cv.getContext("2d");
const FONT = '"Fredoka", "Arial Rounded MT Bold", sans-serif';

// ---------------------------------------------------------------- renkler
const INK = "#1E1B2E";
const C = {
  sari: "#FFD23F", yesil: "#3DDC84", kirmizi: "#FF4D5E", beyaz: "#FFFFFF", krem: "#FFF6E5",
  ten: "#FFD3B0", tenKoyu: "#F2B48C", sac: "#3B2A20", lacivert: "#2B3A67", fular: "#E63946", sort: "#3D5A80",
  kum: "#F6D186", kumKoyu: "#E3B567", kumIslak: "#D9A85A", deniz: "#13B3C4", denizKoyu: "#0B7A99",
  palmiye: "#2EAD5B", palmiyeKoyu: "#1E8C45", govde: "#A0673A", govdeKoyu: "#7A4A26",
};
const SECENEK = [
  { ad: "YATAK ALTI", renk: "#4D96FF" }, { ad: "DOLAP", renk: "#FF7A45" },
  { ad: "BABAANNE", renk: "#9B5DE5" }, { ad: "ÖZÜR DİLE", renk: "#12B5A8" },
];

// ---------------------------------------------------------------- yardımcılar
const sat = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ara = (t, a, b) => sat((t - a) / (b - a));
const E = {
  io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  o: k => 1 - Math.pow(1 - k, 3), i: k => k * k * k, q: k => k * k,
  sine: k => -(Math.cos(Math.PI * k) - 1) / 2,
  back: k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  elastic: k => k === 0 ? 0 : k === 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * (2 * Math.PI) / 3) + 1,
  bounce: k => { const n = 7.5625, d = 2.75; if (k < 1 / d) return n * k * k; if (k < 2 / d) return n * (k -= 1.5 / d) * k + .75;
    if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + .9375; return n * (k -= 2.625 / d) * k + .984375; },
};
function rnd(a, b = 0) { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); }
function hex2rgba(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function karistir(h1, h2, k) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const r = Math.round(lerp(a >> 16 & 255, b >> 16 & 255, k)), gg = Math.round(lerp(a >> 8 & 255, b >> 8 & 255, k)), bb = Math.round(lerp(a & 255, b & 255, k));
  return `rgb(${r},${gg},${bb})`;
}

// ---------------------------------------------------------------- çizim temel taşları (temiz kontur)
function sekil(cizim, dolgu, kontur = INK, lw = 7) {
  g.beginPath(); cizim(); if (dolgu) { g.fillStyle = dolgu; g.fill(); }
  if (kontur && lw) { g.lineWidth = lw; g.strokeStyle = kontur; g.lineJoin = "round"; g.lineCap = "round"; g.stroke(); }
}
function daire(x, y, r, dolgu, kontur = INK, lw = 7) { sekil(() => g.arc(x, y, r, 0, Math.PI * 2), dolgu, kontur, lw); }
function elips(x, y, rx, ry, dolgu, kontur = INK, lw = 7, rot = 0) { sekil(() => g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2), dolgu, kontur, lw); }
function yuvarlakDik(x, y, w, h, r, dolgu, kontur = INK, lw = 7) { sekil(() => g.roundRect(x, y, w, h, r), dolgu, kontur, lw); }
function cizgi(pts, renk, lw, konturlu = true) { // kalın, konturlu çizgi (kol/bacak)
  const yol = () => { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); };
  g.lineCap = "round"; g.lineJoin = "round";
  if (konturlu) { yol(); g.lineWidth = lw + 12; g.strokeStyle = INK; g.stroke(); }
  yol(); g.lineWidth = lw; g.strokeStyle = renk; g.stroke();
}
function parilti(x, y, r, renk, alfa = 1) { // yumuşak ışık halesi
  if (alfa <= 0) return; const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, hex2rgba(renk, .9 * alfa)); gr.addColorStop(.35, hex2rgba(renk, .35 * alfa)); gr.addColorStop(1, hex2rgba(renk, 0));
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
}
function yildizSekil(x, y, r1, r2, n, rot, dolgu, kontur = INK, lw = 5) {
  sekil(() => { for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n, r = i % 2 ? r2 : r1; i ? g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : g.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } g.closePath(); }, dolgu, kontur, lw);
}
function pirilti(x, y, r, rot, alfa = 1) { // 4 köşeli parlama
  if (alfa <= 0) return; g.save(); g.globalAlpha = alfa; g.translate(x, y); g.rotate(rot);
  g.fillStyle = "#fff"; g.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .22 : r; i ? g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : g.moveTo(rr, 0); }
  g.closePath(); g.fill(); g.restore();
}
function yazi(m, x, y, o = {}) {
  const { boyut = 80, renk = "#fff", kontur = INK, klw = 14, hiza = "center", agirlik = 700, alfa = 1, aci = 0, olcek = 1, golge = true } = o;
  if (alfa <= 0) return;
  g.save(); g.globalAlpha = alfa; g.translate(x, y); g.rotate(aci); g.scale(olcek, olcek);
  g.font = `${agirlik} ${boyut}px ${FONT}`; g.textAlign = hiza; g.textBaseline = "middle"; g.lineJoin = "round";
  if (golge) { g.fillStyle = "rgba(0,0,0,.35)"; g.fillText(m, 0, boyut * .09); if (kontur) { g.lineWidth = klw; g.strokeStyle = "rgba(0,0,0,.35)"; g.strokeText(m, 0, boyut * .09); } }
  if (kontur) { g.lineWidth = klw; g.strokeStyle = kontur; g.strokeText(m, 0, 0); }
  g.fillStyle = renk; g.fillText(m, 0, 0); g.restore();
}

// ---------------------------------------------------------------- SEÇENEK İKONLARI
function yatakIkon(x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  yuvarlakDik(-140, -120, 34, 200, 12, "#8B5A2B");
  yuvarlakDik(-115, -30, 250, 56, 16, "#FFFFFF");
  yuvarlakDik(-105, -62, 80, 40, 16, "#BDE0FE");
  sekil(() => { g.moveTo(-15, -36); g.quadraticCurveTo(60, -50, 135, -30); g.lineTo(135, 34); g.lineTo(-15, 34); g.closePath(); }, "#4D96FF");
  yuvarlakDik(-140, 26, 290, 26, 8, "#A0673A");
  yuvarlakDik(-128, 50, 18, 44, 5, "#7A4A26"); yuvarlakDik(118, 50, 18, 44, 5, "#7A4A26");
  g.fillStyle = "rgba(20,15,30,.6)"; g.fillRect(-110, 52, 228, 40);
  for (const k of [-1, 1]) { elips(k * 14, 72, 10, 12, "#fff", INK, 3); daire(k * 14 + 2, 74, 4.5, INK, null, 0); }
  g.restore();
}
function dolapIkon(x, y, s) {
  g.save(); g.translate(x, y); g.scale(s, s);
  yuvarlakDik(-110, -160, 220, 34, 10, "#A86B3F");
  yuvarlakDik(-95, -128, 190, 250, 10, "#C98B4B");
  sekil(() => { g.moveTo(0, -126); g.lineTo(0, 120); }, null, INK, 6);
  for (const k of [-1, 1]) { yuvarlakDik(k > 0 ? 16 : -80, -108, 64, 90, 8, "rgba(255,255,255,.18)", "rgba(30,27,46,.5)", 4); yuvarlakDik(k > 0 ? 16 : -80, 0, 64, 100, 8, "rgba(255,255,255,.18)", "rgba(30,27,46,.5)", 4); daire(k * 14, -6, 8, "#FFD23F", INK, 4); }
  yuvarlakDik(-90, 120, 18, 26, 4, "#7A4A26"); yuvarlakDik(72, 120, 18, 26, 4, "#7A4A26");
  sekil(() => { g.moveTo(-6, 60); g.quadraticCurveTo(-30, 96, -14, 116); g.lineTo(6, 112); g.quadraticCurveTo(0, 90, 6, 64); }, "#FF4D5E", INK, 4); // kapıdan sarkan çorap
  g.restore();
}
function babaanneKafa(x, y, s, o = {}) { // yazmalı, gözlüklü babaanne başı (merkez = yüz merkezi)
  const t = o.t || 0;
  g.save(); g.translate(x, y); g.scale(s, s);
  // yazma (arka)
  sekil(() => { g.moveTo(-118, 30); g.bezierCurveTo(-140, -120, -60, -150, 0, -150); g.bezierCurveTo(60, -150, 140, -120, 118, 30); g.quadraticCurveTo(80, 120, 0, 128); g.quadraticCurveTo(-80, 120, -118, 30); g.closePath(); }, "#5FA85F");
  g.save(); g.beginPath(); g.moveTo(-118, 30); g.bezierCurveTo(-140, -120, -60, -150, 0, -150); g.bezierCurveTo(60, -150, 140, -120, 118, 30); g.quadraticCurveTo(80, 120, 0, 128); g.quadraticCurveTo(-80, 120, -118, 30); g.clip();
  g.fillStyle = "rgba(255,255,255,.75)"; for (let i = 0; i < 40; i++) { g.beginPath(); g.arc(-130 + (i % 8) * 36 + (Math.floor(i / 8) % 2) * 18, -150 + Math.floor(i / 8) * 60, 6, 0, Math.PI * 2); g.fill(); }
  g.restore();
  // yüz
  daire(0, 0, 86, C.ten);
  // yazmanın alın kenarı + oya
  sekil(() => { g.moveTo(-96, 6); g.bezierCurveTo(-96, -90, 96, -90, 96, 6); g.bezierCurveTo(80, -60, -80, -60, -96, 6); g.closePath(); }, "#5FA85F", INK, 6);
  for (let i = 0; i < 11; i++) { const a = Math.PI + .25 + i * (Math.PI - .5) / 10; daire(Math.cos(a) * 82, -18 + Math.sin(a) * 56, 7, ["#FFD23F", "#FF4D5E", "#fff"][i % 3], INK, 3); }
  // yanaklar
  g.fillStyle = "rgba(255,120,120,.4)"; g.beginPath(); g.ellipse(-50, 34, 18, 11, 0, 0, Math.PI * 2); g.ellipse(50, 34, 18, 11, 0, 0, Math.PI * 2); g.fill();
  // gözler (mutlu kıvrık) + gözlük
  for (const k of [-1, 1]) {
    if (o.kizgin) { sekil(() => { g.moveTo(k * 32 - 14, 4); g.lineTo(k * 32 + 14, 4); }, null, INK, 7); }
    else sekil(() => { g.moveTo(k * 32 - 14, 8); g.quadraticCurveTo(k * 32, -6, k * 32 + 14, 8); }, null, INK, 7);
    sekil(() => { g.moveTo(k * 32 + 20, 22); g.lineTo(k * 32 + 30, 28); }, null, "rgba(30,27,46,.5)", 4);
    daire(k * 32, 6, 26, "rgba(255,255,255,.25)", "#B08D57", 6);
  }
  sekil(() => { g.moveTo(-8, 4); g.quadraticCurveTo(0, -4, 8, 4); }, null, "#B08D57", 6);
  // burun + ağız
  sekil(() => { g.moveTo(0, 16); g.quadraticCurveTo(8, 30, 0, 34); }, null, "rgba(30,27,46,.6)", 5);
  if (o.konus) elips(0, 56, 14, 10 + Math.abs(Math.sin(t * 14)) * 6, "#8E2C3A", INK, 5);
  else sekil(() => { g.moveTo(-22, 52); g.quadraticCurveTo(0, 68, 22, 52); }, null, INK, 6);
  // çene altı düğüm
  sekil(() => { g.moveTo(-26, 96); g.quadraticCurveTo(0, 116, 26, 96); g.lineTo(14, 134); g.lineTo(0, 118); g.lineTo(-14, 134); g.closePath(); }, "#5FA85F", INK, 5);
  g.restore();
}
function kalpSekil(x, y, r, renk = "#FF4D5E", lw = 6) {
  sekil(() => { g.moveTo(x, y + r * .9); g.bezierCurveTo(x - r * 1.5, y - r * .1, x - r * .8, y - r * 1.2, x, y - r * .45); g.bezierCurveTo(x + r * .8, y - r * 1.2, x + r * 1.5, y - r * .1, x, y + r * .9); g.closePath(); }, renk, INK, lw);
}
function ozurIkon(x, y, s, t = 0) {
  g.save(); g.translate(x, y); g.scale(s, s);
  kalpSekil(0, -6, 120 * (1 + .04 * Math.sin(t * 6)), "#FF4D5E", 9);
  g.fillStyle = "rgba(255,255,255,.6)"; g.beginPath(); g.ellipse(-50, -60, 24, 14, -.6, 0, Math.PI * 2); g.fill();
  yuvarlakDik(-80, 60, 160, 50, 25, "#fff", INK, 6); yazi("PARDON", 0, 86, { boyut: 34, renk: INK, kontur: null, golge: false });
  g.restore();
}
const ESYA_CIZ = [
  (x, y, s) => yatakIkon(x, y + 10, s * .95),
  (x, y, s) => dolapIkon(x, y + 10, s * .9),
  (x, y, s, t) => babaanneKafa(x, y + 10, s * .95, { t }),
  (x, y, s, t) => ozurIkon(x, y, s * .9, t),
];

// ---------------------------------------------------------------- EV ÇİZİMLERİ
const EV = { duvar: "#FCE1C4", duvar2: "#F6CFA5", zemin: "#D49A66", zeminKoyu: "#A86B3F", hali: "#F7F2E8", haliKenar: "#3D5A80", kola: "#4A2511" };
const UFUK = 1250;
function oda(o = {}) {
  const gr = g.createLinearGradient(0, 0, 0, UFUK); gr.addColorStop(0, o.duvar2 || EV.duvar2); gr.addColorStop(1, o.duvar || EV.duvar);
  g.fillStyle = gr; g.fillRect(-60, -60, W + 120, UFUK + 60);
  g.fillStyle = "rgba(255,255,255,.32)";
  for (let r = 0; r < 14; r++) for (let c = 0; c < 10; c++) { const x = c * 120 + (r % 2) * 60 - 10, y = r * 92 + 30; g.save(); g.translate(x, y); g.rotate(Math.PI / 4); g.fillRect(-6, -6, 12, 12); g.restore(); }
  const zg = g.createLinearGradient(0, UFUK, 0, H); zg.addColorStop(0, EV.zeminKoyu); zg.addColorStop(1, EV.zemin);
  g.fillStyle = zg; g.fillRect(-60, UFUK, W + 120, H - UFUK + 60);
  g.strokeStyle = "rgba(70,35,10,.35)"; g.lineWidth = 4;
  for (let j = 1; j < 9; j++) { const y = UFUK + Math.pow(j / 9, 1.5) * (H - UFUK + 60); g.beginPath(); g.moveTo(-60, y); g.lineTo(W + 60, y); g.stroke();
    const y0 = UFUK + Math.pow((j - 1) / 9, 1.5) * (H - UFUK + 60); for (let i = 0; i < 6; i++) { const x = ((i * 230 + j * 117) % 1200) - 60; g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y); g.stroke(); } }
  g.fillStyle = "#FFFFFF"; g.fillRect(-60, UFUK - 42, W + 120, 42);
  sekil(() => { g.moveTo(-60, UFUK - 42); g.lineTo(W + 60, UFUK - 42); g.moveTo(-60, UFUK); g.lineTo(W + 60, UFUK); }, null, INK, 7);
}
function pencere(x, y, w, h, t) {
  yuvarlakDik(x - 16, y - 16, w + 32, h + 32, 10, "#FFFFFF");
  const gk = g.createLinearGradient(0, y, 0, y + h); gk.addColorStop(0, "#6EC3F0"); gk.addColorStop(1, "#D2F1FF");
  yuvarlakDik(x, y, w, h, 6, gk, INK, 6);
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  daire(x + w * .75, y + h * .25, 40, "#FFE066", "#F4A100", 5);
  for (let i = 0; i < 2; i++) { const bx = x + ((i * 170 + t * 12) % (w + 160)) - 60, by = y + 90 + i * 110; elips(bx, by, 60, 24, "#fff", "rgba(30,27,46,.25)", 4); elips(bx + 30, by - 18, 34, 22, "#fff", null, 0); }
  sekil(() => { g.moveTo(x - 10, y + h); g.quadraticCurveTo(x + w * .3, y + h - 90, x + w * .6, y + h - 30); g.quadraticCurveTo(x + w * .8, y + h - 80, x + w + 10, y + h - 20); g.lineTo(x + w + 10, y + h + 10); g.lineTo(x - 10, y + h + 10); g.closePath(); }, "#7BC67B", INK, 5);
  g.restore();
  sekil(() => { g.moveTo(x + w / 2, y); g.lineTo(x + w / 2, y + h); g.moveTo(x, y + h / 2); g.lineTo(x + w, y + h / 2); }, null, "#FFFFFF", 12);
  sekil(() => { g.rect(x, y, w, h); }, null, INK, 6);
  yuvarlakDik(x - 34, y + h + 10, w + 68, 26, 8, "#FFFFFF");
  // perdeler
  const dal = Math.sin(t * 1.3) * 6;
  for (const k of [0, 1]) {
    const px = k ? x + w + 40 : x - 40, yon = k ? -1 : 1;
    sekil(() => { g.moveTo(px - yon * 40, y - 50); g.lineTo(px + yon * 70, y - 50); g.quadraticCurveTo(px + yon * 30 + dal, y + h * .5, px + yon * 60, y + h + 40); g.lineTo(px - yon * 40, y + h + 40); g.closePath(); }, "#E07A5F");
    g.strokeStyle = "rgba(30,27,46,.3)"; g.lineWidth = 4; for (let i = 1; i < 3; i++) { g.beginPath(); g.moveTo(px - yon * 40 + yon * i * 34, y - 40); g.lineTo(px - yon * 40 + yon * i * 30, y + h + 30); g.stroke(); }
  }
  yuvarlakDik(x - 110, y - 66, w + 220, 22, 11, "#8B5A2B");
}
function cerceve(x, y, w, h) {
  yuvarlakDik(x, y, w, h, 8, "#C98B4B");
  yuvarlakDik(x + 18, y + 18, w - 36, h - 36, 4, "#BDE7FF", INK, 5);
  g.save(); g.beginPath(); g.rect(x + 18, y + 18, w - 36, h - 36); g.clip();
  sekil(() => { g.moveTo(x, y + h); g.lineTo(x + w * .35, y + h * .4); g.lineTo(x + w * .6, y + h * .75); g.lineTo(x + w * .8, y + h * .5); g.lineTo(x + w, y + h); g.closePath(); }, "#5FA85F", INK, 4);
  daire(x + w * .78, y + h * .3, 14, "#FFD23F", INK, 3); g.restore();
}
function kapi(x, y, w, h, acik, kirmizi = 0) {
  yuvarlakDik(x - 22, y - 22, w + 44, h + 22, 8, "#FFFFFF");
  const ig = g.createLinearGradient(0, y, 0, y + h); ig.addColorStop(0, karistir("#3A2E4A", "#8B1E2B", kirmizi)); ig.addColorStop(1, karistir("#1E1830", "#4A0E18", kirmizi));
  yuvarlakDik(x, y, w, h, 4, ig, INK, 6);
  if (kirmizi > 0) parilti(x + w / 2, y + h * .4, 300, "#FF4D5E", .6 * kirmizi);
  // kapı kanadı (içe doğru açılır: genişliği daralır)
  const kw = w * (1 - .82 * E.io(acik));
  sekil(() => { g.moveTo(x, y); g.lineTo(x + kw, y + 14 * acik); g.lineTo(x + kw, y + h - 6 * acik); g.lineTo(x, y + h); g.closePath(); }, "#B9774A");
  if (acik < .6) { yuvarlakDik(x + kw * .14, y + 40, kw * .72, h * .38, 8, "rgba(255,255,255,.15)", "rgba(30,27,46,.45)", 4); yuvarlakDik(x + kw * .14, y + h * .5, kw * .72, h * .42, 8, "rgba(255,255,255,.15)", "rgba(30,27,46,.45)", 4);
    daire(x + kw * .85, y + h * .52, 13, "#FFD23F", INK, 5); }
}
function kanepe(x, y, w) { // y = zemin teması
  yuvarlakDik(x, y - 280, w, 170, 40, "#E07A5F");
  for (let i = 0; i < 2; i++) yuvarlakDik(x + 40 + i * (w - 80) / 2, y - 250, (w - 100) / 2, 120, 30, "#EE9478", INK, 6);
  yuvarlakDik(x - 20, y - 150, w + 40, 90, 30, "#E07A5F");
  yuvarlakDik(x - 40, y - 210, 70, 160, 30, "#C9634A"); yuvarlakDik(x + w - 30, y - 210, 70, 160, 30, "#C9634A");
  yuvarlakDik(x + 10, y - 62, 22, 62, 6, "#7A4A26"); yuvarlakDik(x + w - 32, y - 62, 22, 62, 6, "#7A4A26");
  daire(x + 90, y - 196, 30, "#FFD23F", INK, 6); daire(x + 90, y - 196, 14, null, "#F4A100", 5);
}
function lamba(x, y) {
  sekil(() => { g.moveTo(x, y); g.lineTo(x, y - 430); }, null, INK, 14); sekil(() => { g.moveTo(x, y); g.lineTo(x, y - 430); }, null, "#C9C2A6", 6);
