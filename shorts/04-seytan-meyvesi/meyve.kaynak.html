<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Şeytan Meyvesi Buldun! Hangisini Yerdin?</title>
<style>
/*@FONT:Fredoka:fredoka:500@*/
/*@FONT:Fredoka:fredoka:600@*/
/*@FONT:Fredoka:fredoka:700@*/
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { display: flex; align-items: center; justify-content: center; }
canvas { height: 96vh; aspect-ratio: 9 / 16; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================================
//  ŞEYTAN MEYVESİ BULDUN! — "4 meyve, 1 seçim; her birinin bir aması var" (özgün meyve çizimleri)
//  Kısayollar: Boşluk = baştan, P = duraklat, Sağ/Sol ok = 5 sn ileri/geri. Ses: ilk tıklamada.
// =====================================================================================
const W = 1080, H = 1920, SURE = 50;
window.SURE = SURE;
const cv = document.getElementById("c"), g = cv.getContext("2d");
const FONT = '"Fredoka", "Arial Rounded MT Bold", sans-serif';

// ---------------------------------------------------------------- renkler
const INK = "#1E1B2E";
const C = {
  sari: "#FFD23F", yesil: "#3DDC84", kirmizi: "#FF4D5E", beyaz: "#FFFFFF", krem: "#FFF6E5",
  ten: "#FFD3B0", tenKoyu: "#F2B48C", sac: "#3B2A20", lacivert: "#2B3A67", fular: "#E63946", sort: "#3D5A80",
  kum: "#F6D186", kumKoyu: "#E3B567", kumIslak: "#D9A85A", deniz: "#13B3C4", denizKoyu: "#0B7A99",
  palmiye: "#2EAD5B", palmiyeKoyu: "#1E8C45", govde: "#A0673A", govdeKoyu: "#7A4A26",
};
const SECENEK = [
  { ad: "LASTİK", renk: "#8E5BD6" }, { ad: "ATEŞ", renk: "#FF7A1A" },
  { ad: "BUZ", renk: "#3D8BD4" }, { ad: "GÖRÜNMEZLİK", renk: "#4FA77A" },
];

// ---------------------------------------------------------------- yardımcılar
const sat = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ara = (t, a, b) => sat((t - a) / (b - a));
const E = {
  io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  o: k => 1 - Math.pow(1 - k, 3), i: k => k * k * k, q: k => k * k,
  sine: k => -(Math.cos(Math.PI * k) - 1) / 2,
  back: k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  elastic: k => k === 0 ? 0 : k === 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * (2 * Math.PI) / 3) + 1,
  bounce: k => { const n = 7.5625, d = 2.75; if (k < 1 / d) return n * k * k; if (k < 2 / d) return n * (k -= 1.5 / d) * k + .75;
    if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + .9375; return n * (k -= 2.625 / d) * k + .984375; },
};
function rnd(a, b = 0) { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); }
function hex2rgba(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function karistir(h1, h2, k) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const r = Math.round(lerp(a >> 16 & 255, b >> 16 & 255, k)), gg = Math.round(lerp(a >> 8 & 255, b >> 8 & 255, k)), bb = Math.round(lerp(a & 255, b & 255, k));
  return `rgb(${r},${gg},${bb})`;
}

// ---------------------------------------------------------------- çizim temel taşları (temiz kontur)
function sekil(cizim, dolgu, kontur = INK, lw = 7) {
  g.beginPath(); cizim(); if (dolgu) { g.fillStyle = dolgu; g.fill(); }
  if (kontur && lw) { g.lineWidth = lw; g.strokeStyle = kontur; g.lineJoin = "round"; g.lineCap = "round"; g.stroke(); }
}
function daire(x, y, r, dolgu, kontur = INK, lw = 7) { sekil(() => g.arc(x, y, r, 0, Math.PI * 2), dolgu, kontur, lw); }
function elips(x, y, rx, ry, dolgu, kontur = INK, lw = 7, rot = 0) { sekil(() => g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2), dolgu, kontur, lw); }
function yuvarlakDik(x, y, w, h, r, dolgu, kontur = INK, lw = 7) { sekil(() => g.roundRect(x, y, w, h, r), dolgu, kontur, lw); }
function cizgi(pts, renk, lw, konturlu = true) { // kalın, konturlu çizgi (kol/bacak)
  const yol = () => { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); };
  g.lineCap = "round"; g.lineJoin = "round";
  if (konturlu) { yol(); g.lineWidth = lw + 12; g.strokeStyle = INK; g.stroke(); }
  yol(); g.lineWidth = lw; g.strokeStyle = renk; g.stroke();
}
function parilti(x, y, r, renk, alfa = 1) { // yumuşak ışık halesi
  if (alfa <= 0) return; const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, hex2rgba(renk, .9 * alfa)); gr.addColorStop(.35, hex2rgba(renk, .35 * alfa)); gr.addColorStop(1, hex2rgba(renk, 0));
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
}
function yildizSekil(x, y, r1, r2, n, rot, dolgu, kontur = INK, lw = 5) {
  sekil(() => { for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n, r = i % 2 ? r2 : r1; i ? g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : g.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } g.closePath(); }, dolgu, kontur, lw);
}
function pirilti(x, y, r, rot, alfa = 1) { // 4 köşeli parlama
  if (alfa <= 0) return; g.save(); g.globalAlpha = alfa; g.translate(x, y); g.rotate(rot);
  g.fillStyle = "#fff"; g.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .22 : r; i ? g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : g.moveTo(rr, 0); }
  g.closePath(); g.fill(); g.restore();
}
function yazi(m, x, y, o = {}) {
  const { boyut = 80, renk = "#fff", kontur = INK, klw = 14, hiza = "center", agirlik = 700, alfa = 1, aci = 0, olcek = 1, golge = true } = o;
  if (alfa <= 0) return;
  g.save(); g.globalAlpha *= alfa; g.translate(x, y); g.rotate(aci); g.scale(olcek, olcek);
  g.font = `${agirlik} ${boyut}px ${FONT}`; g.textAlign = hiza; g.textBaseline = "middle"; g.lineJoin = "round";
  if (golge) { g.fillStyle = "rgba(0,0,0,.35)"; g.fillText(m, 0, boyut * .09); if (kontur) { g.lineWidth = klw; g.strokeStyle = "rgba(0,0,0,.35)"; g.strokeText(m, 0, boyut * .09); } }
  if (kontur) { g.lineWidth = klw; g.strokeStyle = kontur; g.strokeText(m, 0, 0); }
  g.fillStyle = renk; g.fillText(m, 0, 0); g.restore();
}

// ---------------------------------------------------------------- ŞEYTAN MEYVELERİ (özgün çizim, sarmal desenli)
function kalpSekil(x, y, r, renk = "#FF4D5E", lw = 6) {
  sekil(() => { g.moveTo(x, y + r * .9); g.bezierCurveTo(x - r * 1.5, y - r * .1, x - r * .8, y - r * 1.2, x, y - r * .45); g.bezierCurveTo(x + r * .8, y - r * 1.2, x + r * 1.5, y - r * .1, x, y + r * .9); g.closePath(); }, renk, INK, lw);
}
const MEYVE = [
  { govde: "#8E5BD6", sarmal: "#5B2E9E", yaprak: "#3DAA5C", isik: "#C9A3FF" },   // lastik
  { govde: "#FF7A1A", sarmal: "#D7263D", yaprak: "#FFD23F", isik: "#FFB36B" },   // ateş
  { govde: "#8FD8FF", sarmal: "#3D8BD4", yaprak: "#E8F8FF", isik: "#D8F3FF" },   // buz
  { govde: "#E6F4EA", sarmal: "#9CCFB0", yaprak: "#7BD389", isik: "#FFFFFF" },   // görünmezlik
];
function meyveYolu(i) {
  if (i === 1) { g.moveTo(0, -100); g.bezierCurveTo(70, -60, 95, 10, 80, 50); g.bezierCurveTo(60, 100, -60, 100, -80, 50); g.bezierCurveTo(-95, 10, -70, -60, 0, -100); g.closePath(); }
  else if (i === 2) { g.ellipse(0, 0, 82, 96, 0, 0, Math.PI * 2); }
  else if (i === 3) { g.moveTo(0, -92); g.bezierCurveTo(80, -92, 100, 0, 70, 60); g.quadraticCurveTo(40, 100, 0, 96); g.quadraticCurveTo(-40, 100, -70, 60); g.bezierCurveTo(-100, 0, -80, -92, 0, -92); g.closePath(); }
  else { g.arc(0, 0, 92, 0, Math.PI * 2); }
}
function meyve(i, x, y, s, t = 0, o = {}) {
  const M = MEYVE[i];
  g.save(); g.translate(x, y); g.scale(s, s); g.rotate(o.aci || 0);
  if (o.parla) parilti(0, 0, 200, M.isik, o.parla);
  if (i === 3) g.globalAlpha *= .8;
  // ısırık izi: üst sağdan daireler çıkarılır
  g.save();
  if (o.isirik > 0) { g.beginPath(); g.rect(-200, -200, 400, 400); for (let k = 0; k < Math.ceil(o.isirik * 3); k++) g.arc(70 - k * 34, -60 + k * 14, 34, 0, Math.PI * 2, true); g.clip("evenodd"); }
  const gr = g.createRadialGradient(-30, -40, 10, 0, 0, 110); gr.addColorStop(0, M.isik); gr.addColorStop(1, M.govde);
  sekil(() => meyveYolu(i), gr, INK, 8);
  g.save(); g.beginPath(); meyveYolu(i); g.clip(); g.strokeStyle = M.sarmal; g.lineWidth = 7; g.lineCap = "round";
  for (const [cx, cy] of [[-46, -40], [10, -60], [56, -10], [-58, 26], [-2, 6], [44, 56], [-16, 64]]) {
    g.beginPath(); for (let a = 0; a < Math.PI * 3.2; a += .2) { const r = 3 + a * 4.4; const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r; a ? g.lineTo(px, py) : g.moveTo(px, py); } g.stroke(); }
  g.restore();
  if (o.isirik > 0) { g.fillStyle = "#FFF6E5"; for (let k = 0; k < Math.ceil(o.isirik * 3); k++) { g.beginPath(); g.arc(70 - k * 34, -60 + k * 14, 38, 0, Math.PI * 2); g.arc(70 - k * 34, -60 + k * 14, 34, 0, Math.PI * 2, true); g.fill("evenodd"); } }
  g.restore();
  g.fillStyle = "rgba(255,255,255,.5)"; g.beginPath(); g.ellipse(-36, -46, 18, 10, -.6, 0, Math.PI * 2); g.fill();
  // sap + kıvrık yaprak
  const ust = i === 1 ? -100 : i === 2 ? -96 : -92;
  sekil(() => { g.moveTo(0, ust + 6); g.quadraticCurveTo(-6, ust - 30, 10, ust - 46); }, null, INK, 14); sekil(() => { g.moveTo(0, ust + 6); g.quadraticCurveTo(-6, ust - 30, 10, ust - 46); }, null, "#7A4A26", 7);
  if (i === 2) { for (let k = 0; k < 3; k++) { g.save(); g.translate(10, ust - 40); g.rotate(-.8 + k * .8); sekil(() => { g.moveTo(0, 0); g.lineTo(12, -30); g.lineTo(0, -60); g.lineTo(-12, -30); g.closePath(); }, M.yaprak, INK, 5); g.restore(); } }
  else if (i === 1) { for (let k = 0; k < 3; k++) { g.save(); g.translate(10, ust - 40); g.rotate(-.6 + k * .6); const d = Math.sin(t * 10 + k) * 4; sekil(() => { g.moveTo(-10, 0); g.quadraticCurveTo(-14 + d, -30, 0, -54); g.quadraticCurveTo(14 + d, -30, 10, 0); g.closePath(); }, k === 1 ? "#FFD23F" : "#FF4D5E", INK, 5); g.restore(); } }
  else sekil(() => { g.moveTo(8, ust - 40); g.bezierCurveTo(40, ust - 80, 90, ust - 40, 60, ust - 10); g.bezierCurveTo(50, ust - 40, 30, ust - 40, 8, ust - 40); g.closePath(); }, M.yaprak, INK, 5);
  if (i === 3) for (let k = 0; k < 3; k++) pirilti(-60 + k * 60, -80 + (k % 2) * 140, 18, t * 3 + k, .6 + .4 * Math.sin(t * 5 + k));
  g.restore();
}
const ESYA_CIZ = [0, 1, 2, 3].map(i => (x, y, s, t) => meyve(i, x, y + 6, s * .95, t));
// ---------------------------------------------------------------- ADA SAHNESİ
// gun: 0 = gündüz, .5 = gün batımı, 1 = gece
function gokyuzu(gun, t) {
  const ust = gun < .5 ? karistir("#2D9CDB", "#FF7E5F", gun * 2) : karistir("#FF7E5F", "#0B1B3F", (gun - .5) * 2);
  const alt = gun < .5 ? karistir("#A8E6FF", "#FEC27A", gun * 2) : karistir("#FEC27A", "#2C3E70", (gun - .5) * 2);
  const gr = g.createLinearGradient(0, 0, 0, 1150); gr.addColorStop(0, ust); gr.addColorStop(1, alt);
  g.fillStyle = gr; g.fillRect(-W, -H, W * 3, H * 3);
  if (gun > .6) for (let i = 0; i < 70; i++) { const a = sat((gun - .6) / .3) * (.5 + .5 * Math.sin(t * 3 + i)); g.fillStyle = `rgba(255,255,255,${a})`; g.beginPath(); g.arc(rnd(i, 1) * W, rnd(i, 2) * 900, 1.5 + rnd(i, 3) * 2.5, 0, Math.PI * 2); g.fill(); }
}
function gunes(gun, t) {
  const x = 790 - gun * 320, y = 360 + gun * 820;
  if (gun < .85) {
    parilti(x, y, 330, gun < .4 ? "#FFF3B0" : "#FFB36B", 1 - gun * .6);
    g.save(); g.translate(x, y); g.rotate(t * .25);
    for (let i = 0; i < 12; i++) { g.rotate(Math.PI / 6); g.fillStyle = `rgba(255,240,170,${.35 * (1 - gun)})`; g.beginPath(); g.moveTo(0, -125); g.lineTo(18, -180); g.lineTo(-18, -180); g.fill(); }
    g.restore();
    daire(x, y, 105, gun < .4 ? "#FFE066" : "#FF9F43", "#F4A100", 8);
  }
  if (gun > .55) { const a = sat((gun - .55) / .3); g.save(); g.globalAlpha = a; parilti(300, 330, 220, "#DDE8FF", .6); daire(300, 330, 80, "#F4F1DE", "#C9C2A6", 6); daire(270, 310, 16, "#E2DCC2", null, 0); daire(325, 355, 11, "#E2DCC2", null, 0); g.restore(); }
  return [x, y];
}
function bulut(x, y, s, alfa = 1) {
  g.save(); g.globalAlpha = alfa; g.translate(x, y); g.scale(s, s);
  sekil(() => { g.arc(-60, 10, 45, Math.PI * .5, Math.PI * 1.5); g.arc(-10, -25, 60, Math.PI, Math.PI * 1.9); g.arc(55, -5, 45, Math.PI * 1.3, Math.PI * .5); g.closePath(); }, "#fff", "rgba(30,27,46,.25)", 6);
  g.restore();
}
function deniz(gun, t, ufuk = 1020) {
  const ust = karistir(C.deniz, "#123B6B", gun), alt = karistir(C.denizKoyu, "#0A1E3D", gun);
  const gr = g.createLinearGradient(0, ufuk, 0, H); gr.addColorStop(0, ust); gr.addColorStop(1, alt);
  g.fillStyle = gr; g.fillRect(-W, ufuk, W * 3, H * 2);
  for (let r = 0; r < 7; r++) {           // dalga çizgileri
    const yy = ufuk + 30 + r * r * 14, a = .5 - r * .04;
    g.strokeStyle = `rgba(255,255,255,${a})`; g.lineWidth = 3 + r; g.lineCap = "round";
    for (let i = 0; i < 6; i++) { const xx = ((i * 260 + t * (30 + r * 12) + r * 90) % 1560) - 240; g.beginPath(); g.moveTo(xx, yy); g.quadraticCurveTo(xx + 40, yy - 10, xx + 80, yy); g.stroke(); }
  }
  for (let i = 0; i < 26; i++) pirilti(rnd(i, 5) * W, ufuk + 20 + rnd(i, 6) * 260, 10 + rnd(i, 7) * 10, 0, Math.max(0, Math.sin(t * 3 + i * 2)) * (1 - gun));
}
function palmiye(x, y, s, t) {
  const sal = Math.sin(t * 1.4) * .04, tepe = [-120 + sal * 300, -560];
  g.save(); g.translate(x, y); g.scale(s, s);
  // gövde: kavisli, aşağıdan yukarı incelen
  const P = u => { const c = [50, -300]; return [(1 - u) * (1 - u) * 0 + 2 * (1 - u) * u * c[0] + u * u * tepe[0], 2 * (1 - u) * u * c[1] + u * u * tepe[1]]; };
  const N = u => { const a = P(Math.max(0, u - .01)), b = P(Math.min(1, u + .01)), dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy); return [-dy / l, dx / l]; };
  const gen = u => lerp(46, 24, u);
  const sol = [], sag = [];
  for (let i = 0; i <= 24; i++) { const u = i / 24, p = P(u), n = N(u), w = gen(u); sol.push([p[0] + n[0] * w, p[1] + n[1] * w]); sag.push([p[0] - n[0] * w, p[1] - n[1] * w]); }
  const govde = () => { g.moveTo(...sol[0]); sol.forEach(p => g.lineTo(...p)); sag.reverse().forEach(p => g.lineTo(...p)); sag.reverse(); g.closePath(); };
  const gg = g.createLinearGradient(-40, 0, 40, 0); gg.addColorStop(0, "#C08552"); gg.addColorStop(.6, "#A0673A"); gg.addColorStop(1, "#7A4A26");
  sekil(govde, gg);
  g.save(); g.beginPath(); govde(); g.clip(); g.strokeStyle = "#6E4223"; g.lineWidth = 6; g.lineCap = "round";
  for (let i = 1; i < 14; i++) { const u = i / 14, p = P(u), n = N(u), w = gen(u) + 4, d = N(u); const tx = -d[1], ty = d[0];
    g.beginPath(); g.moveTo(p[0] + n[0] * w, p[1] + n[1] * w); g.quadraticCurveTo(p[0] + tx * 14, p[1] + ty * 14, p[0] - n[0] * w, p[1] - n[1] * w); g.stroke(); }
  g.fillStyle = "rgba(255,255,255,.18)"; for (let i = 0; i < 24; i++) { const u = i / 24 + .02, p = P(u), n = N(u); g.beginPath(); g.ellipse(p[0] + n[0] * gen(u) * .45, p[1] + n[1] * gen(u) * .45, 4, 9, 0, 0, Math.PI * 2); g.fill(); }
  g.restore(); sekil(govde, null);
  // yapraklar (tırtıklı, sarkık)
  const yaprak = (aci, L, renk, renk2) => {
    const a = aci + Math.sin(t * 1.7 + aci * 3) * .04, sar = L * .5;
    const uc = [tepe[0] + Math.cos(a) * L, tepe[1] + Math.sin(a) * L * .55 + sar], kt = [tepe[0] + Math.cos(a) * L * .55, tepe[1] + Math.sin(a) * L * .8 - 50];
    const Q = u => [(1 - u) * (1 - u) * tepe[0] + 2 * (1 - u) * u * kt[0] + u * u * uc[0], (1 - u) * (1 - u) * tepe[1] + 2 * (1 - u) * u * kt[1] + u * u * uc[1]];
    const Tn = u => { const p = Q(Math.max(0, u - .01)), q = Q(Math.min(1, u + .01)), dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
    const ust = [], alt = [];
    for (let i = 0; i <= 22; i++) { const u = i / 22, p = Q(u), [tx, ty] = Tn(u), nx = -ty, ny = tx, gen2 = Math.sin(Math.PI * Math.min(1, u * 1.1)) * 58 * (i % 2 ? 1.18 : .62);
      ust.push([p[0] + nx * gen2 - tx * 8 * (i % 2 ? 0 : 1), p[1] + ny * gen2 - ty * 8 * (i % 2 ? 0 : 1)]); alt.push([p[0] - nx * gen2 * .7 - tx * 8 * (i % 2 ? 0 : 1), p[1] - ny * gen2 * .7 - ty * 8 * (i % 2 ? 0 : 1)]); }
    sekil(() => { g.moveTo(...tepe); for (let i = 1; i + 1 < ust.length; i += 2) g.quadraticCurveTo(...ust[i], ...ust[i + 1]); g.lineTo(...ust[ust.length - 1]);
      for (let i = alt.length - 2; i - 1 >= 0; i -= 2) g.quadraticCurveTo(...alt[i], ...alt[i - 1]); g.closePath(); }, renk, INK, 5);
    sekil(() => { g.moveTo(...tepe); g.quadraticCurveTo(...kt, ...uc); }, null, renk2, 5);
  };
  for (const a of [-2.75, -1.95, -1.2, -.4]) yaprak(a, 300, "#1E8C45", "#14662F");   // arka sıra (koyu)
  for (const [dx, dy] of [[-14, 30], [18, 36], [2, 52]]) { daire(tepe[0] + dx, tepe[1] + dy, 25, "#7A4A26"); g.fillStyle = "rgba(255,255,255,.3)"; g.beginPath(); g.arc(tepe[0] + dx - 8, tepe[1] + dy - 8, 7, 0, Math.PI * 2); g.fill(); }
  for (const a of [-3.05, -2.35, -1.6, -.8, -.05]) yaprak(a, 330, "#2EAD5B", "#1E8C45");  // ön sıra
  daire(tepe[0], tepe[1] + 4, 20, "#2EAD5B", INK, 5);
  g.restore();
}
