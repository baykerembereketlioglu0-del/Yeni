<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Uzaylılar Dünyayı İstila Etti! Yanına 1 Ünlü Al</title>
<style>
/*@FONT:Fredoka:fredoka:500@*/
/*@FONT:Fredoka:fredoka:600@*/
/*@FONT:Fredoka:fredoka:700@*/
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================================
//  UZAYLILAR DÜNYAYI İSTİLA ETTİ! — "Kurtarmak için 1 ünlü seç" (ünlüler karikatür/parodi)  (1080x1920, 50 sn döngü) — Deniz Seçti
//  Kısayollar: Boşluk = baştan, P = duraklat, Sağ/Sol ok = 5 sn ileri/geri. Ses: ilk tıklamada.
// =====================================================================================
const W = 1080, H = 1920, SURE = 50;
window.SURE = SURE;
const cv = document.getElementById("c"), g = cv.getContext("2d");
const FONT = '"Fredoka", "Arial Rounded MT Bold", sans-serif';

// ---------------------------------------------------------------- renkler
const INK = "#1E1B2E";
const C = {
  sari: "#FFD23F", yesil: "#3DDC84", kirmizi: "#FF4D5E", beyaz: "#FFFFFF", krem: "#FFF6E5",
  ten: "#FFD3B0", tenKoyu: "#F2B48C", sac: "#3B2A20", lacivert: "#2B3A67", fular: "#E63946", sort: "#3D5A80",
  kum: "#F6D186", kumKoyu: "#E3B567", kumIslak: "#D9A85A", deniz: "#13B3C4", denizKoyu: "#0B7A99",
  palmiye: "#2EAD5B", palmiyeKoyu: "#1E8C45", govde: "#A0673A", govdeKoyu: "#7A4A26",
};
const SECENEK = [
  { ad: "ENES BATUR", renk: "#FF7A45" }, { ad: "MRBEAST", renk: "#4D96FF" },
  { ad: "ELON MUSK", renk: "#5C677D" }, { ad: "RONALDO", renk: "#D7263D" },
];

// ---------------------------------------------------------------- yardımcılar
const sat = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ara = (t, a, b) => sat((t - a) / (b - a));
const E = {
  io: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  o: k => 1 - Math.pow(1 - k, 3), i: k => k * k * k, q: k => k * k,
  sine: k => -(Math.cos(Math.PI * k) - 1) / 2,
  back: k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  elastic: k => k === 0 ? 0 : k === 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - .75) * (2 * Math.PI) / 3) + 1,
  bounce: k => { const n = 7.5625, d = 2.75; if (k < 1 / d) return n * k * k; if (k < 2 / d) return n * (k -= 1.5 / d) * k + .75;
    if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + .9375; return n * (k -= 2.625 / d) * k + .984375; },
};
function rnd(a, b = 0) { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); }
function hex2rgba(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function karistir(h1, h2, k) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const r = Math.round(lerp(a >> 16 & 255, b >> 16 & 255, k)), gg = Math.round(lerp(a >> 8 & 255, b >> 8 & 255, k)), bb = Math.round(lerp(a & 255, b & 255, k));
  return `rgb(${r},${gg},${bb})`;
}

// ---------------------------------------------------------------- çizim temel taşları (temiz kontur)
function sekil(cizim, dolgu, kontur = INK, lw = 7) {
  g.beginPath(); cizim(); if (dolgu) { g.fillStyle = dolgu; g.fill(); }
  if (kontur && lw) { g.lineWidth = lw; g.strokeStyle = kontur; g.lineJoin = "round"; g.lineCap = "round"; g.stroke(); }
}
function daire(x, y, r, dolgu, kontur = INK, lw = 7) { sekil(() => g.arc(x, y, r, 0, Math.PI * 2), dolgu, kontur, lw); }
function elips(x, y, rx, ry, dolgu, kontur = INK, lw = 7, rot = 0) { sekil(() => g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2), dolgu, kontur, lw); }
function yuvarlakDik(x, y, w, h, r, dolgu, kontur = INK, lw = 7) { sekil(() => g.roundRect(x, y, w, h, r), dolgu, kontur, lw); }
function cizgi(pts, renk, lw, konturlu = true) { // kalın, konturlu çizgi (kol/bacak)
  const yol = () => { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); };
  g.lineCap = "round"; g.lineJoin = "round";
  if (konturlu) { yol(); g.lineWidth = lw + 12; g.strokeStyle = INK; g.stroke(); }
  yol(); g.lineWidth = lw; g.strokeStyle = renk; g.stroke();
}
function parilti(x, y, r, renk, alfa = 1) { // yumuşak ışık halesi
  if (alfa <= 0) return; const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, hex2rgba(renk, .9 * alfa)); gr.addColorStop(.35, hex2rgba(renk, .35 * alfa)); gr.addColorStop(1, hex2rgba(renk, 0));
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
}
function yildizSekil(x, y, r1, r2, n, rot, dolgu, kontur = INK, lw = 5) {
  sekil(() => { for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n, r = i % 2 ? r2 : r1; i ? g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : g.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } g.closePath(); }, dolgu, kontur, lw);
}
function pirilti(x, y, r, rot, alfa = 1) { // 4 köşeli parlama
  if (alfa <= 0) return; g.save(); g.globalAlpha = alfa; g.translate(x, y); g.rotate(rot);
  g.fillStyle = "#fff"; g.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * .22 : r; i ? g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : g.moveTo(rr, 0); }
  g.closePath(); g.fill(); g.restore();
}
function yazi(m, x, y, o = {}) {
  const { boyut = 80, renk = "#fff", kontur = INK, klw = 14, hiza = "center", agirlik = 700, alfa = 1, aci = 0, olcek = 1, golge = true } = o;
  if (alfa <= 0) return;
  g.save(); g.globalAlpha = alfa; g.translate(x, y); g.rotate(aci); g.scale(olcek, olcek);
  g.font = `${agirlik} ${boyut}px ${FONT}`; g.textAlign = hiza; g.textBaseline = "middle"; g.lineJoin = "round";
  if (golge) { g.fillStyle = "rgba(0,0,0,.35)"; g.fillText(m, 0, boyut * .09); if (kontur) { g.lineWidth = klw; g.strokeStyle = "rgba(0,0,0,.35)"; g.strokeText(m, 0, boyut * .09); } }
  if (kontur) { g.lineWidth = klw; g.strokeStyle = kontur; g.strokeText(m, 0, 0); }
  g.fillStyle = renk; g.fillText(m, 0, 0); g.restore();
}

// ---------------------------------------------------------------- SEÇENEK İKONLARI (ünlü kafaları)
function kalpSekil(x, y, r, renk = "#FF4D5E", lw = 6) {
  sekil(() => { g.moveTo(x, y + r * .9); g.bezierCurveTo(x - r * 1.5, y - r * .1, x - r * .8, y - r * 1.2, x, y - r * .45); g.bezierCurveTo(x + r * .8, y - r * 1.2, x + r * 1.5, y - r * .1, x, y + r * .9); g.closePath(); }, renk, INK, lw);
}
const ESYA_CIZ = [
  (x, y, s, t) => enesKafa(x, y + 30, s * .74, { t }),
  (x, y, s, t) => mrbeastKafa(x, y + 18, s * .8, { t }),
  (x, y, s, t) => elonKafa(x, y + 18, s * .78, { t }),
  (x, y, s, t) => ronaldoKafa(x, y + 14, s * .8, { t }),
];
// ---------------------------------------------------------------- ÜNLÜLER (karikatür; parodi)
function yuzGoz(ex, ey, rx, ry, iris, bak = [0, 0], kirp = 1) {
  elips(ex, ey, rx, ry * kirp, "#fff", INK, 6);
  if (kirp > .5) { daire(ex + bak[0] * rx * .3, ey + bak[1] * ry * .3 + 2, rx * .58, iris, INK, 3); daire(ex + bak[0] * rx * .3, ey + bak[1] * ry * .3 + 2, rx * .3, INK, null, 0); daire(ex + bak[0] * rx * .3 + 4, ey + bak[1] * ry * .3 - 3, rx * .16, "#fff", null, 0); }
}
function kas(x, y, w, aci, kal = 10, renk = INK) { g.save(); g.translate(x, y); g.rotate(aci); sekil(() => { g.moveTo(-w / 2, 0); g.quadraticCurveTo(0, -kal * .6, w / 2, 0); }, null, renk, kal); g.restore(); }
function disliGulus(y, w, h, renk = "#8E2C3A") { // geniş, dişleri görünen gülüş
  sekil(() => { g.moveTo(-w / 2, y); g.quadraticCurveTo(0, y + h * 2, w / 2, y); g.closePath(); }, renk, INK, 6);
  g.save(); g.beginPath(); g.moveTo(-w / 2, y); g.quadraticCurveTo(0, y + h * 2, w / 2, y); g.closePath(); g.clip();
  g.fillStyle = "#fff"; g.fillRect(-w / 2, y - 2, w, h * .55); g.strokeStyle = "rgba(30,27,46,.35)"; g.lineWidth = 2; for (let i = 1; i < 6; i++) { g.beginPath(); g.moveTo(-w / 2 + i * w / 6, y); g.lineTo(-w / 2 + i * w / 6, y + h * .55); g.stroke(); }
  daire(0, y + h * 1.2, w * .22, "#FF7A8A", null, 0); g.restore();
  sekil(() => { g.moveTo(-w / 2, y); g.quadraticCurveTo(0, y + h * 2, w / 2, y); g.closePath(); }, null, INK, 6);
}
function kirpma(t, faz = 0) { return ((t + faz) % 3.1) < .11 ? .12 : 1; }
// ENES BATUR: kabarık koyu kıvırcık saç, yuvarlak yüz, kalın kaşlar, kocaman gülüş
function enesKafa(x, y, s, o = {}) {
  const t = o.t || 0, TEN = "#F6D2B8", SAC = "#3A2720";
  g.save(); g.translate(x, y); g.scale(s, s);
  elips(-92, 8, 16, 22, TEN); elips(92, 8, 16, 22, TEN);
  daire(0, 0, 92, TEN);
  // kabarık, dalgalı, yukarı-arkaya taranmış saç
  const sacYol = () => { g.moveTo(-96, -6); g.bezierCurveTo(-114, -90, -92, -168, -26, -184); g.bezierCurveTo(36, -200, 104, -168, 106, -104); g.bezierCurveTo(108, -60, 100, -30, 96, -6);
    g.quadraticCurveTo(90, -50, 70, -66); g.bezierCurveTo(50, -76, 34, -86, 10, -82); g.bezierCurveTo(-16, -78, -30, -90, -54, -74); g.quadraticCurveTo(-84, -56, -96, -6); g.closePath(); };
  sekil(sacYol, SAC);
  g.save(); g.beginPath(); sacYol(); g.clip(); g.lineCap = "round";
  for (let i = 0; i < 6; i++) { g.strokeStyle = i % 2 ? "rgba(0,0,0,.28)" : "rgba(255,255,255,.22)"; g.lineWidth = 6; g.beginPath(); g.moveTo(-70 + i * 26, -76); g.bezierCurveTo(-76 + i * 26, -120, -40 + i * 26, -150, 10 + i * 18, -180); g.stroke(); }
  g.restore(); sekil(sacYol, null);
  sekil(() => { g.moveTo(-40, -78); g.bezierCurveTo(-60, -120, -20, -150, 20, -140); g.bezierCurveTo(-6, -128, -20, -108, -40, -78); g.closePath(); }, SAC, INK, 5); // öne kalkık dalga
  g.fillStyle = "rgba(255,120,120,.32)"; g.beginPath(); g.ellipse(-56, 32, 18, 11, 0, 0, Math.PI * 2); g.ellipse(56, 32, 18, 11, 0, 0, Math.PI * 2); g.fill();
  const k = kirpma(t, .4);
  if (o.gul) for (const kx of [-34, 34]) sekil(() => { g.moveTo(kx - 18, 0); g.quadraticCurveTo(kx, -20, kx + 18, 0); }, null, INK, 8);
  else if (o.komik) { yuzGoz(-34, -4, 21, 24, "#5A3A22", [1, 0], 1); yuzGoz(34, -4, 21, 24, "#5A3A22", [-1, 0], 1); }
  else { yuzGoz(-34, -4, 21, 24, "#5A3A22", o.bak, k); yuzGoz(34, -4, 21, 24, "#5A3A22", o.bak, k); }
  kas(-34, -38, 46, -.08, 12, SAC); kas(34, -38, 46, .08, 12, SAC);
  sekil(() => { g.moveTo(-4, 4); g.quadraticCurveTo(10, 22, -2, 28); }, null, "rgba(30,27,46,.55)", 5);
  if (o.komik) { sekil(() => { g.moveTo(-34, 40); g.quadraticCurveTo(0, 56, 34, 40); }, null, INK, 7); sekil(() => { g.moveTo(-16, 46); g.quadraticCurveTo(-18, 92 + Math.sin(t * 10) * 6, 4, 92 + Math.sin(t * 10) * 6); g.quadraticCurveTo(22, 90, 16, 46); g.closePath(); }, "#FF7A8A", INK, 6); }
  else if (o.gul) { const a2 = Math.abs(Math.sin(t * 16)) * 8; sekil(() => { g.moveTo(-44, 34); g.quadraticCurveTo(0, 100 + a2, 44, 34); g.closePath(); }, "#8E2C3A", INK, 6); daire(0, 70 + a2 * .5, 16, "#FF7A8A", null, 0); }
  else if (o.konus) elips(0, 50, 22, 12 + Math.abs(Math.sin(t * 14)) * 12, "#8E2C3A", INK, 6); else disliGulus(38, 76, 20);
  g.restore();
}
// MRBEAST: yukarı taranmış kahverengi saç, dolgun sakal + bıyık, kocaman dişli sırıtış, mavi gözler
function mrbeastKafa(x, y, s, o = {}) {
  const t = o.t || 0, TEN = "#F1C6A8", SAC = "#8A5A34", SAKAL = "#6B4428";
  g.save(); g.translate(x, y); g.scale(s, s);
  elips(-86, 6, 15, 22, TEN); elips(86, 6, 15, 22, TEN);
  elips(0, 4, 86, 102, TEN);
  // sakal (çene boyunca)
  sekil(() => { g.moveTo(-86, -4); g.quadraticCurveTo(-90, 70, -40, 98); g.quadraticCurveTo(0, 118, 40, 98); g.quadraticCurveTo(90, 70, 86, -4); g.quadraticCurveTo(70, 40, 40, 44); g.quadraticCurveTo(0, 30, -40, 44); g.quadraticCurveTo(-70, 40, -86, -4); g.closePath(); }, SAKAL);
  g.save(); g.strokeStyle = "rgba(255,255,255,.12)"; g.lineWidth = 3; for (let i = 0; i < 14; i++) { const a = Math.PI * (.15 + i / 13 * .7), r = 80; g.beginPath(); g.moveTo(Math.cos(a) * r * .9, 30 + Math.sin(a) * r * .6); g.lineTo(Math.cos(a) * r, 34 + Math.sin(a) * r * .75); g.stroke(); } g.restore();
  // bıyık
  sekil(() => { g.moveTo(-44, 36); g.quadraticCurveTo(-20, 18, 0, 26); g.quadraticCurveTo(20, 18, 44, 36); g.quadraticCurveTo(20, 30, 0, 34); g.quadraticCurveTo(-20, 30, -44, 36); g.closePath(); }, SAKAL, INK, 5);
  // yukarı taranmış saç (kabarık perçem)
  sekil(() => { g.moveTo(-86, -10); g.quadraticCurveTo(-96, -90, -50, -112); g.quadraticCurveTo(-30, -150, 20, -142); g.quadraticCurveTo(70, -140, 80, -104); g.quadraticCurveTo(96, -70, 86, -10); g.quadraticCurveTo(80, -56, 58, -66); g.quadraticCurveTo(20, -84, -10, -74); g.quadraticCurveTo(-50, -70, -70, -50); g.quadraticCurveTo(-82, -36, -86, -10); g.closePath(); }, SAC);
  g.strokeStyle = "rgba(255,255,255,.25)"; g.lineWidth = 5; g.lineCap = "round"; for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(-40 + i * 26, -84); g.quadraticCurveTo(-30 + i * 26, -122, 0 + i * 22, -134); g.stroke(); }
  const k = kirpma(t, 1.1); yuzGoz(-32, -16, 19, 23, "#4D96FF", o.bak, k); yuzGoz(32, -16, 19, 23, "#4D96FF", o.bak, k);
  kas(-32, -50, 40, -.18, 10, SAKAL); kas(32, -50, 40, .18, 10, SAKAL);
  sekil(() => { g.moveTo(-4, -4); g.quadraticCurveTo(10, 14, -2, 20); }, null, "rgba(30,27,46,.55)", 5);
  if (o.konus) elips(0, 60, 26, 10 + Math.abs(Math.sin(t * 14)) * 14, "#8E2C3A", INK, 6); else disliGulus(46, 92, 24);
  if (o.dolar) for (const kx of [-32, 32]) { daire(kx, -16, 24, "#3DDC84", INK, 5); yazi("$", kx, -14, { boyut: 38, renk: "#fff", kontur: INK, klw: 6, golge: false }); }
  g.restore();
}
// ELON MUSK: geniş yüz ve çene, kısa koyu saç (yüksek alın, yan ayrım), kısık gözler, yarım gülüş
function elonKafa(x, y, s, o = {}) {
  const t = o.t || 0, TEN = "#F3D0B5", SAC = "#4A3426";
  g.save(); g.translate(x, y); g.scale(s, s);
  elips(-100, 12, 16, 24, TEN); elips(100, 12, 16, 24, TEN);
  sekil(() => { g.moveTo(-98, -46); g.quadraticCurveTo(-100, -110, 0, -112); g.quadraticCurveTo(100, -110, 98, -46); g.quadraticCurveTo(104, 40, 92, 70); g.quadraticCurveTo(70, 112, 0, 118); g.quadraticCurveTo(-70, 112, -92, 70); g.quadraticCurveTo(-104, 40, -98, -46); g.closePath(); }, TEN);
  // geriye taranmış kısa saç, şakaklar açık (M saç çizgisi)
  const sacYol = () => { g.moveTo(-98, -40); g.quadraticCurveTo(-108, -120, -10, -132); g.quadraticCurveTo(90, -136, 104, -70); g.quadraticCurveTo(104, -52, 98, -40); g.quadraticCurveTo(92, -66, 66, -72);
    g.quadraticCurveTo(52, -96, 30, -84); g.quadraticCurveTo(0, -92, -26, -86); g.quadraticCurveTo(-50, -100, -64, -74); g.quadraticCurveTo(-90, -66, -98, -40); g.closePath(); };
  sekil(sacYol, SAC);
  g.save(); g.beginPath(); sacYol(); g.clip(); g.strokeStyle = "rgba(255,255,255,.2)"; g.lineWidth = 5; g.lineCap = "round";
  for (let i = 0; i < 6; i++) { g.beginPath(); g.moveTo(-60 + i * 26, -84); g.quadraticCurveTo(-50 + i * 26, -118, -20 + i * 24, -132); g.stroke(); } g.restore(); sekil(sacYol, null);
  const k = kirpma(t, 2.0); yuzGoz(-38, -14, 20, 15, "#7A8FA6", o.bak, k); yuzGoz(38, -14, 20, 15, "#7A8FA6", o.bak, k);
  if (k > .5) for (const kx of [-38, 38]) sekil(() => { g.moveTo(kx - 22, -20); g.quadraticCurveTo(kx, -34, kx + 22, -20); }, C.ten === TEN ? null : TEN, INK, 6); // ağır göz kapağı
  kas(-38, -42, 50, .06, 12, SAC); kas(38, -42, 50, -.06, 12, SAC);
  sekil(() => { g.moveTo(-4, -2); g.quadraticCurveTo(14, 30, -4, 38); }, null, "rgba(30,27,46,.55)", 5);
  sekil(() => { g.moveTo(-52, 30); g.quadraticCurveTo(-58, 50, -46, 66); g.moveTo(52, 30); g.quadraticCurveTo(58, 50, 46, 66); }, null, "rgba(30,27,46,.25)", 4);
  if (o.konus) elips(4, 70, 20, 8 + Math.abs(Math.sin(t * 14)) * 10, "#8E2C3A", INK, 6);
  else sekil(() => { g.moveTo(-34, 70); g.quadraticCurveTo(0, 78, 30, 64); g.quadraticCurveTo(38, 58, 40, 50); }, null, INK, 7);
  sekil(() => { g.moveTo(-12, 104); g.quadraticCurveTo(0, 110, 12, 104); }, null, "rgba(30,27,46,.35)", 4);
  g.restore();
}
// RONALDO: bronz ten, keskin çene, yanları kısa (fade) üstü şekilli koyu saç, kalın kaşlar, parlak gülüş, küpe
function ronaldoKafa(x, y, s, o = {}) {
  const t = o.t || 0, TEN = "#D69A72", SAC = "#1E1714";
  g.save(); g.translate(x, y); g.scale(s, s);
  elips(-88, 8, 15, 22, TEN); elips(88, 8, 15, 22, TEN); daire(-90, 28, 6, "#E8F4FF", INK, 3);
  sekil(() => { g.moveTo(-88, -40); g.quadraticCurveTo(-92, -100, 0, -104); g.quadraticCurveTo(92, -100, 88, -40); g.quadraticCurveTo(90, 40, 56, 84); g.quadraticCurveTo(26, 116, 0, 118); g.quadraticCurveTo(-26, 116, -56, 84); g.quadraticCurveTo(-90, 40, -88, -40); g.closePath(); }, TEN);
  // fade (yanlar kısa)
